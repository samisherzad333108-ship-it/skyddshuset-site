  <script>
    function showPage(pageId) {
      // Hide all pages
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      // Show targeted page
      document.getElementById('page-' + pageId).classList.add('active');

      // Update navbar tab styling
      const tabs = ['home', 'horlurar', 'laddare'];
      tabs.forEach(tab => {
        const btn = document.getElementById('nav-' + tab);
        if(tab === pageId) {
          btn.className = "flex-none bg-[#1f3b76] text-white rounded-full px-4 py-1.5 text-xs font-semibold shadow-sm";
        } else {
          btn.className = "flex-none bg-white border border-gray-200 rounded-full px-4 py-1.5 text-xs font-semibold text-gray-700 shadow-sm";
        }
      });

      // Scroll to top
      window.scrollTo(0, 0);
    }
  </script>
