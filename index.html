<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skyddshuset</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .page-transition { transition: opacity 0.25s ease-in-out, transform 0.25s ease-in-out; }
    .drawer-transition { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .modal-transition { transition: opacity 0.25s ease, transform 0.25s ease; }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900 pb-20">

  <!-- Dynamic Component Wrappers -->
  <div id="announcement-wrapper"></div>
  <div id="header-wrapper"></div>
  <div id="menu-wrapper"></div>

  <!-- Category Nav Pills & Main Grid -->
  <main class="max-w-md mx-auto px-4 pt-4">
    <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
      <button id="btn-all" onclick="filterCategory('all')" class="cat-btn bg-slate-900 text-white px-5 py-2 rounded-full text-xs font-semibold shadow-sm">Alla</button>
      <button id="btn-horlurar" onclick="filterCategory('horlurar')" class="cat-btn bg-white text-gray-700 border border-gray-200 px-5 py-2 rounded-full text-xs font-semibold shadow-sm">Hörlurar</button>
      <button id="btn-laddare" onclick="filterCategory('laddare')" class="cat-btn bg-white text-gray-700 border border-gray-200 px-5 py-2 rounded-full text-xs font-semibold shadow-sm">Laddare & Kablar</button>
    </div>

    <!-- Main Content Area -->
    <div id="content-area" class="page-transition opacity-100 transform translate-y-0 mt-3 space-y-4">
      <div id="hero-wrapper"></div>
      <div class="grid grid-cols-2 gap-3" id="product-grid"></div>
    </div>
  </main>

  <div id="modal-wrapper"></div>
  <div id="cart-wrapper"></div>

  <!-- Floating Chat Button -->
  <button class="fixed bottom-4 right-4 z-40 bg-white border border-gray-200 text-slate-800 text-xs font-bold px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 hover:bg-gray-50">
    <i class="fa-regular fa-comment text-sm"></i>
    <span>Chatt</span>
  </button>

  <script src="js/app.js"></script>
</body>
</html>
