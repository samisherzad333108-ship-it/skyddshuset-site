<div id="product-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-end justify-center hidden opacity-0 transition-opacity duration-300" onclick="closeProductModal(event)">
  <div id="modal-box" class="bg-white w-full max-w-md rounded-t-3xl p-6 transform translate-y-full modal-transition shadow-2xl max-h-[90vh] overflow-y-auto">
    <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-4"></div>
    
    <div class="h-56 bg-gray-50 rounded-2xl flex items-center justify-center mb-4 overflow-hidden p-2 border border-gray-100">
      <img id="modal-img" src="" alt="Product" class="h-full object-contain" />
    </div>

    <div class="space-y-2">
      <span id="modal-cat" class="text-[10px] font-extrabold text-blue-600 uppercase tracking-widest">Kategori</span>
      <h2 id="modal-title" class="text-lg font-bold text-slate-900 leading-snug">Produktnamn</h2>
      <p id="modal-sku" class="text-xs text-gray-400 font-medium">SKU: 6601232118D</p>
      
      <div class="flex items-center gap-2 pt-1">
        <span id="modal-price" class="text-xl font-black text-red-600">0 kr</span>
        <span id="modal-old-price" class="text-xs text-gray-400 line-through hidden">0 kr</span>
        <span id="modal-badge" class="bg-red-100 text-red-600 text-[10px] font-bold px-1.5 py-0.5 rounded hidden">-31%</span>
      </div>

      <div class="flex items-center gap-2 pt-1 text-xs text-blue-600 font-semibold">
        <span class="h-2.5 w-2.5 rounded-full bg-blue-600"></span>
        <span>I lager</span>
      </div>

      <p id="modal-desc" class="text-xs text-gray-600 mt-2 leading-relaxed">Produktbeskrivning visas här.</p>
    </div>

    <div class="mt-6 space-y-3">
      <div class="flex items-center gap-3">
        <div class="flex items-center border border-gray-300 rounded-lg bg-white shadow-sm">
          <button onclick="updateQty(-1)" class="px-3 py-2 text-gray-500 font-bold text-sm">-</button>
          <span id="qty-val" class="px-3 text-xs font-bold text-slate-800">1</span>
          <button onclick="updateQty(1)" class="px-3 py-2 text-gray-500 font-bold text-sm">+</button>
        </div>
        <button onclick="addToCart()" class="flex-1 bg-gray-200 text-gray-800 font-bold py-3 rounded-lg text-xs shadow-sm active:scale-95 transition">Add to cart</button>
      </div>

      <button onclick="addToCart()" class="w-full bg-slate-900 text-white font-bold py-3 rounded-lg text-xs shadow-md flex items-center justify-center gap-2">
        <span>Köp med</span>
        <span class="font-extrabold text-sm">G Pay</span>
      </button>

      <button onclick="closeProductModal()" class="w-full py-2 bg-gray-100 text-gray-500 font-bold rounded-lg text-xs">Stäng</button>
    </div>
  </div>
</div>
