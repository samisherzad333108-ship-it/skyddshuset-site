<header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
  <div class="max-w-md mx-auto px-4 py-3 grid grid-cols-3 items-center">
    
    <!-- Left Corner: Hamburger Button -->
    <div class="flex items-center justify-start">
      <button onclick="toggleMenu(true)" class="text-slate-900 text-xl focus:outline-none p-1">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>

    <!-- Center: Brand Logo -->
    <div class="text-center cursor-pointer" onclick="filterCategory('all')">
      <h1 class="text-xl font-black text-slate-900 tracking-tight">Skyddshuset</h1>
      <p class="text-[8px] tracking-widest text-gray-400 font-bold uppercase">Mobiltillbehör</p>
    </div>

    <!-- Right Corner: Cart Button -->
    <div class="flex items-center justify-end">
      <button onclick="toggleCart(true)" class="relative text-slate-900 hover:text-blue-600 p-1">
        <i class="fa-solid fa-bag-shopping text-xl"></i>
        <span id="cart-count" class="absolute -top-1 -right-2 bg-blue-800 text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center">0</span>
      </button>
    </div>

  </div>

  <!-- Search Input Bar -->
  <div class="max-w-md mx-auto px-4 pb-3">
    <div class="flex items-center border border-gray-200 rounded-xl px-3 py-2 bg-gray-50 shadow-inner">
      <select class="bg-transparent text-xs text-gray-600 border-r border-gray-300 pr-2 mr-2 outline-none font-medium">
        <option>Alla kategorier</option>
        <option>Apple</option>
        <option>Samsung</option>
        <option>Laddare & Kablar</option>
        <option>Hörlurar</option>
      </select>
      <input id="search-input" onkeyup="handleSearch()" type="text" placeholder="Vad letar du efter?" class="w-full text-xs outline-none bg-transparent text-slate-800" />
      <i class="fa-solid fa-microphone text-gray-400 text-xs ml-2"></i>
      <i class="fa-solid fa-magnifying-glass text-gray-600 text-xs ml-2"></i>
    </div>
  </div>
</header>
