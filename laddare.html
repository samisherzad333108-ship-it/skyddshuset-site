
<html lang="sv">

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

<body>

  <!-- Announcement Banner -->

      <div>

    <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm flex space-x-3 items-center">

        <span class="bg-red-600 text-white text-[9px] font-extrabold px-1.5 py-0.5 rounded uppercase">Kabel</span>
